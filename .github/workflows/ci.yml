name: Verify dining polls
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Start disposable Supabase
        shell: bash
        run: |
          npm run db -- start
          eval "$(npx --no-install supabase status -o env | grep -E '^(API_URL|ANON_KEY|DB_URL)=')"
          {
            echo "TEST_SUPABASE_URL=$API_URL"
            echo "TEST_SUPABASE_KEY=$ANON_KEY"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "BENCH_DATABASE_URL=$DB_URL"
          } >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run test:integration
      - run: npm run test:browser
        env:
          TEST_BROWSER_CHANNEL: chrome
      - name: Realtime and polling smoke benchmarks
        shell: bash
        run: |
          BENCH_CLIENTS=2 BENCH_SAMPLES=3 npm run benchmark:realtime
          BENCH_CLIENTS=2 BENCH_SAMPLES=3 BENCH_TRANSPORT=polling BENCH_WRITE=direct npm run benchmark:realtime
      - name: Query plan smoke benchmark
        shell: bash
        run: |
          psql "$BENCH_DATABASE_URL" -v group_count=8 -v polls_per_group=10 -v voter_count=25 -f benchmarks/query-plans.sql
      - if: failure()
        name: Realtime service diagnostics
        run: |
          docker ps -a --filter name=supabase_realtime --format '{{.Names}}' |
            xargs -r -n 1 docker logs --tail 60
      - if: always()
        run: npm run db -- stop --no-backup
