name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Unit tests, the production build and browser tests. No database needed:
  # the browser tests run the poll screens against a fake data source.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
  # Starts local Supabase (which applies every migration to an empty database),
  # then runs the security and Realtime tests against it.
  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db -- start
      - name: Export local Supabase credentials
        shell: bash
        run: |
          npx supabase status -o env > /tmp/supabase-status.env
          set -a
          source /tmp/supabase-status.env
          set +a
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Row level security, voting and API token tests
        run: npm run test:rls
      - name: Realtime integration test
        run: npm run test:realtime
      - run: npm run db -- stop --no-backup
        if: always()
